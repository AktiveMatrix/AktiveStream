[package]
name = "aktivestream-client"
description = "Shared, platform-neutral client logic: the connection phone book and the SSH tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Public-domain 8x8 bitmap font for the overlay toolbar text (connection name); pure data.
font8x8 = "0.3"
# Encode the remote framebuffer to PNG for the screen-capture button (shared so every client
# writes identical files). Same version the other crates pin.
png = "0.17"
