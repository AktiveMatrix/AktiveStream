[package]
name = "aktivestream-linux"
description = "AktiveStream Linux client (X11/Wayland)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aktivestream"
path = "src/main.rs"

[dependencies]
aktivestream-rfb.workspace = true
aktivestream-keymap.workspace = true
aktivestream-client = { path = "../aktivestream-client" }
aktivestream-proto = { path = "../aktivestream-proto" }
# Cross-platform windowing (X11 + Wayland) and a CPU framebuffer surface.
winit = "0.30"
softbuffer = "0.4"
# Headless snapshot mode (AKTIVE_SNAPSHOT) writes a decoded frame to a PNG, for verifying the
# pipeline without a display server or screenshot tool.
png = "0.17"
# Public-domain 8x8 bitmap font for the overlay toolbar text (connection name); pure data.
font8x8 = "0.3"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
# Opt-in diagnostics for the QUIC/TLS handshake (RUST_LOG=…); quinn/rustls use the log crate.
env_logger = "0.11"
# The native QUIC/HEVC path's video decoder. Optional and gated behind the `native` feature:
# ffmpeg bindings are pinned to the system ffmpeg's major version (ffmpeg-next 9 wants ffmpeg 8)
# and ffmpeg cannot build on Windows, so the RFB client builds everywhere without it. Build the
# native path with `--features native` on a Linux box that has ffmpeg's dev libraries.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }

[features]
native = ["dep:ffmpeg-next"]
