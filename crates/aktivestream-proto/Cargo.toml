[package]
name = "aktivestream-proto"
description = "Phase 2 native transport: QUIC/TLS client and wire messages for the Swift host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
# QUIC with the ring crypto provider (no cmake/nasm toolchain needed on Windows, unlike aws-lc-rs).
quinn = { version = "0.11.6", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1.10"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
sha2 = "0.10"

[dev-dependencies]
png = "0.17"
