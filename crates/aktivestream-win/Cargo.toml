[package]
name = "aktivestream-win"
description = "AktiveStream Windows client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aktivestream"
path = "src/main.rs"

[dependencies]
aktivestream-rfb.workspace = true
aktivestream-keymap.workspace = true
aktivestream-client = { path = "../aktivestream-client" }
aktivestream-proto = { path = "../aktivestream-proto" }
aktivestream-video = { path = "../aktivestream-video" }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }
# Writes --screenshot captures (diagnostics); same version as aktivestream-rfb's smoke example.
png = "0.17"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
